  <!-- Header -->
  <header class="app-header">
    <a href="/" class="brand" title="Genbounty LLM Hunter">
      <img src="/img/Genbounty.png" alt="Genbounty LLM Hunter" class="brand-logo" width="36" height="36">
      <div>
        <h1>Genbounty LLM Hunter</h1>
      </div>
    </a>
    <div class="header-selects">
      <select :value="site" @change="onHeaderSiteChange" title="Site in scope">
        <option value="">Select site...</option>
        <option v-for="s in sites" :key="s" :value="s">{{ s }}</option>
        <option value="__create__">Create new…</option>
      </select>
      <span class="header-component-cluster">
        <select
          :value="component"
          :disabled="!site"
          class="border-button"
          @change="onHeaderComponentChange"
          title="Component in scope"
        >
          <option value="">Select component...</option>
          <option v-for="c in components" :key="c" :value="c">{{ c }}</option>
          <option value="__create__" :disabled="!site">Create new…</option>
        </select>
        <button
          type="button"
          class="btn-icon-quick-connect"
          :class="{
            'is-ready': quickConnectConnected,
            'is-busy': quickConnectBusy,
            'is-error': quickConnectFailed,
          }"
          @click="quickConnectFromHeader"
          :disabled="!canQuickConnect"
          :title="quickConnectTitle"
          aria-label="Quick connect"
        >
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M6.2 3.2a2.2 2.2 0 0 1 3.1 0l.7.7a.75.75 0 0 1-1.06 1.06l-.7-.7a.7.7 0 0 0-.99 0L5.5 6a.7.7 0 0 0 0 .99l.7.7A.75.75 0 1 1 5.14 8.8l-.7-.7a2.2 2.2 0 0 1 0-3.1l1.76-1.8Zm4.66 3.2a.75.75 0 0 1 1.06 0l.7.7a2.2 2.2 0 0 1 0 3.1l-1.76 1.8a2.2 2.2 0 0 1-3.1 0l-.7-.7a.75.75 0 1 1 1.06-1.06l.7.7a.7.7 0 0 0 .99 0L11.5 10a.7.7 0 0 0 0-.99l-.7-.7a.75.75 0 0 1 0-1.06ZM9.53 5.47a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 1 1-1.06-1.06l3-3a.75.75 0 0 1 1.06 0Z"
            />
          </svg>
        </button>
      </span>
      <select
        id="header-category-select"
        class="header-category-select"
        :value="activeCategoryL1"
        :disabled="!activeCategoryOptions.length"
        @change="setActiveCategory($event.target.value)"
        title="Playbook category in scope (shared across tabs)"
      >
        <option v-if="!activeCategoryOptions.length" value="">No categories yet</option>
        <option v-for="group in activeCategoryOptions" :key="group.key" :value="group.key">
          {{ group.label }}
        </option>
      </select>
      <select
        id="header-playbook-select"
        class="header-playbook-select"
        :value="activePlaybookId"
        :disabled="!activePlaybookOptions.length"
        @change="setActivePlaybook($event.target.value)"
        title="Playbook in scope (shared across tabs)"
      >
        <option v-if="!activePlaybookOptions.length" value="">No plays yet</option>
        <option v-for="row in activePlaybookOptions" :key="row.id" :value="row.id">{{ row.label }}</option>
      </select>
      <div class="header-tools" :class="{ 'is-open': headerToolsOpen }">
        <button
          type="button"
          class="btn-icon-header-tools"
          @click.stop="toggleHeaderTools"
          :aria-expanded="headerToolsOpen ? 'true' : 'false'"
          aria-haspopup="menu"
          aria-controls="header-tools-menu"
          title="Cache and wipe tools"
          aria-label="Cache and wipe tools"
        >
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M6.7 1.05a.7.7 0 0 1 .66-.45h1.28a.7.7 0 0 1 .66.45l.2.62c.3.08.58.2.85.35l.58-.3a.7.7 0 0 1 .9.26l.64 1.11a.7.7 0 0 1-.18.92l-.5.4c.1.28.16.57.19.87l.64.15a.7.7 0 0 1 .54.68v1.28a.7.7 0 0 1-.54.68l-.64.15c-.03.3-.09.59-.19.87l.5.4a.7.7 0 0 1 .18.92l-.64 1.11a.7.7 0 0 1-.9.26l-.58-.3a4.4 4.4 0 0 1-.85.35l-.2.62a.7.7 0 0 1-.66.45H7.36a.7.7 0 0 1-.66-.45l-.2-.62a4.4 4.4 0 0 1-.85-.35l-.58.3a.7.7 0 0 1-.9-.26l-.64-1.11a.7.7 0 0 1 .18-.92l.5-.4a4.5 4.5 0 0 1-.19-.87l-.64-.15A.7.7 0 0 1 2 8.64V7.36a.7.7 0 0 1 .54-.68l.64-.15c.03-.3.09-.59.19-.87l-.5-.4a.7.7 0 0 1-.18-.92l.64-1.11a.7.7 0 0 1 .9-.26l.58.3c.27-.15.55-.27.85-.35l.2-.62ZM8 10.25A2.25 2.25 0 1 0 8 5.75a2.25 2.25 0 0 0 0 4.5Z"
            />
          </svg>
        </button>
        <div
          v-if="headerToolsOpen"
          id="header-tools-menu"
          class="header-tools-menu"
          role="menu"
          @click.stop
          @keydown.escape.stop="closeHeaderTools"
        >
          <button
            type="button"
            class="btn btn-sm header-tools-item"
            role="menuitem"
            :class="confirmButtonClass('header-clear-cache', 'btn-secondary')"
            @click="startClearAllCachesAndLocalStorage"
            title="Clear all caches and browser localStorage (site/component, playbook, tab selections), then reload"
          >{{ confirmButtonLabel('header-clear-cache', 'Clear Cache') }}</button>
          <div class="header-tools-nuke-row" role="none">
            <button
              type="button"
              class="btn btn-sm header-tools-item"
              role="menuitem"
              :class="confirmButtonClass('header-nuke', 'btn-nuke', 'btn-nuke-confirm')"
              @click="startNuke"
              :disabled="!site || !component || pipelineBusy || nukeJobActive"
              title="Nuke this component: wipe tests, logs, intel, theory history, and attacks. Keeps config.yaml, auth.json, and recon. Full backup under nuke_backups/. Clears localStorage and reloads."
            >{{ confirmButtonLabel('header-nuke', 'Nuke') }}</button>
            <button
              type="button"
              class="btn-icon-help"
              tabindex="0"
              aria-label="Nuke help"
              title="What Nuke does"
              @click="openNukeHelpModal"
            >?</button>
          </div>
        </div>
      </div>
      <button
        v-if="pipelineBusy"
        type="button"
        class="btn btn-ghost btn-sm header-pipeline-stop"
        @click="cancelPipeline"
        title="Cancel the active pipeline job"
      >Stop</button>
      <button
        type="button"
        class="btn btn-primary btn-sm header-pipeline-cta is-premium"
        @click="openPremiumModal('start_battle')"
        title="Start Battle is a Premium feature"
      >Start Battle · Premium</button>
    </div>
  </header>
